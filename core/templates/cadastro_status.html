{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
  <h3>Cadastro de Status</h3>

  <form method="POST" class="mb-4">
    {% csrf_token %}
    <input type="hidden" name="status_id" id="id_status_id">
    <div class="row g-2 align-items-end">
      <div class="col-md-6">
        <label for="id_nome">Nome</label>
        <input type="text" name="nome" id="id_nome" value="{{ form.nome.value }}" class="form-control">
      </div>
      <div class="col-md-auto">
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="{% url 'configuracoes' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </div>
  </form>

  <div class="input-group mb-3">
    <span class="input-group-text"><i class="bi bi-search"></i></span>
    <input type="text" class="form-control" placeholder="Buscar por nome..." onkeyup="filtrarTabela(this)">
  </div>

  <table class="table table-bordered table-striped">
    <thead>
      <tr><th>Nome</th><th style="width: 150px;">Ações</th></tr>
    </thead>
    <tbody>
      {% for status in lista %}
      <tr>
        <td>{{ status.nome }}</td>
        <td>
          <button class="btn btn-warning btn-sm"
                  onclick="editarStatus('{{ status.id }}', '{{ status.nome }}')">Editar</button>
          <button class="btn btn-danger btn-sm"
                  onclick="confirmarExclusaoStatus('{{ status.id }}')">Excluir</button>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="2">Nenhum status cadastrado.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% if mensagem %}
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      exibirModalSucesso("{{ mensagem|escapejs }}");
    });
  </script>
{% endif %}


{% endblock %}
