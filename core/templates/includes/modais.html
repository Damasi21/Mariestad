<!-- Modal de Sucesso -->
<div class="modal fade" id="modalSucesso" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">Sucesso</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="modalMensagemSucesso">Ação realizada com sucesso!</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal de Confirmação Genérica -->
<div class="modal fade" id="modalConfirmacao" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <!-- Cabeçalho com cor dinâmica -->
      <div class="modal-header text-white" id="modalHeaderConfirmacao">
        <h5 class="modal-title">Confirmação</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="modalMensagemConfirmacao">Deseja continuar?</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-danger" id="btnConfirmarAcao">Sim</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts para os modais -->
<script>
function exibirModalSucesso(mensagem) {
  const msg = document.getElementById('modalMensagemSucesso');
  msg.textContent = mensagem;
  const modal = new bootstrap.Modal(document.getElementById('modalSucesso'));
  modal.show();
}

// tipo = 'success', 'danger', 'warning'
function confirmarAcao(mensagem, callback, tipo = 'warning') {
  document.getElementById('modalMensagemConfirmacao').textContent = mensagem;

  const header = document.getElementById('modalHeaderConfirmacao');
  header.classList.remove('bg-success', 'bg-danger', 'bg-warning');

  if (tipo === 'success') {
    header.classList.add('bg-success');
  } else if (tipo === 'danger') {
    header.classList.add('bg-danger');
  } else {
    header.classList.add('bg-warning');
  }

  const btn = document.getElementById('btnConfirmarAcao');
  btn.onclick = () => {
    const confirmModal = bootstrap.Modal.getInstance(document.getElementById('modalConfirmacao'));
    confirmModal.hide();
    callback();
  };

  const modal = new bootstrap.Modal(document.getElementById('modalConfirmacao'));
  modal.show();
}
</script>

<!-- Modal de CONTATO EM CLIENTES  -->

<div class="modal fade" id="modalContatosCliente" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Contatos do Cliente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">

        <h6>Adicionar Novo Contato</h6>
        <form id="formNovoContato" method="POST">      
          <input type="hidden" name="cliente_id" id="contato_cliente_id">
          <input type="hidden" name="contato_id" id="id_contato_id">
          <div class="row g-2">
            <div class="col-md-6">
              <input type="text" class="form-control" name="nome" placeholder="Nome" required>
            </div>
            <div class="col-md-6">
              <input type="text" class="form-control" name="cargo" placeholder="Cargo" required>
            </div>
            <div class="col-md-6">
              <input type="text" class="form-control" name="telefone1" placeholder="Telefone 1">
            </div>
            <div class="col-md-6">
              <input type="text" class="form-control" name="telefone2" placeholder="Telefone 2">
            </div>
            <div class="col-md-6">
              <input type="email" class="form-control" name="email" placeholder="E-mail">
            </div>
            <div class="col-md-6">
              <input type="text" class="form-control" name="observacoes" placeholder="Observações">
            </div>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-3">
            <button type="submit" class="btn btn-success">Salvar Contato</button>
          </div>
        </form>
      
        <hr class="my-4">

        <h6>Contatos cadastrados</h6>
          <div id="listaContatosCliente" class="table-responsive">
            <!-- conteúdo dinâmico será inserido aqui via JS -->
            <table class="table table-striped table-bordered mt-2">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Cargo</th>
                  <th>Telefone(s)</th>
                  <th>E-mail</th>
                  <th class="text-center" style="width: 80px;">Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaContatosCliente">
                <!-- linhas virão via JS -->
              </tbody>
            </table>
          </div>

      </div>
    </div>
  </div>
</div>
